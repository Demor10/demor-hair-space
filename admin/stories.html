<body class="admin-body">

<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="brand-mini">Demor Admin</div>
    <a href="bookings.html">Bookings</a>
    <a href="services.html">Services & Prices</a>

  <main class="admin-main">
    <h1>Customer Stories</h1>
    <p class="subtitle">Approve stories before they appear on the homepage. Pending stories are never shown publicly.</p>

    <div class="admin-card">

      <div id="pending-list"><p class="muted">Loading…</p></div>
    </div>

    <div class="admin-card">
      <h3 style="margin-top:0; font-family:var(--font-display); color:var(--navy-900);">Approved (live on homepage)</h3>
      <div id="approved-list"><p class="muted">Loading…</p></div>
    </div>
  </main>
</div>
